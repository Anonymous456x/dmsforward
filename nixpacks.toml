[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.virtualenv"]

[phases.install]
cmds = [
  "python3 -m venv venv",
  "source venv/bin/activate",
  "pip install --no-cache-dir --break-system-packages -r requirements.txt"
]

[phases.start]
cmd = "bash start.sh"

[metadata]
watch = false
